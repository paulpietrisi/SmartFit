# ==============================================================
# 1. SETARI GENERALE SI SERVER
# ==============================================================
spring.application.name=smartfit
server.port=8080

server.tomcat.max-http-response-header-size=65536
server.servlet.session.cookie.http-only=true

# ==============================================================
# 2. CONEXIUNEA LA BAZA DE DATE (MariaDB)
# ==============================================================
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/smartfit_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==============================================================
# 3. CONFIGURARE JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# ==============================================================
# 4. CONFIGURARE THYMELEAF
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==============================================================
# 5. RESURSE STATICE
# ==============================================================
spring.web.resources.static-locations=classpath:/static/

# ==============================================================
# 6. LOGGING
# ==============================================================
logging.level.org.springframework.security=INFO
logging.level.com.smartfit=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# Upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# ==============================================================
# 7. STRIPE (test mode)
# ==============================================================
stripe.secret-key=YOUR_STRIPE_KEY_HERE

stripe.publishable-key=YOUR_STRIPE_KEY_HERE


