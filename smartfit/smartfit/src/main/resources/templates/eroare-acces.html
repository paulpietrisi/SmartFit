<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acces interzis | SmartFit</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, Arial, sans-serif; }
        body {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg, #0A2540 0%, #0066CC 100%);
        }
        .card {
            background:#fff; border-radius:16px; padding:48px 40px; max-width:440px;
            text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.2);
        }
        .icon { font-size:56px; margin-bottom:16px; }
        h1 { color:#0A2540; font-size:24px; margin-bottom:12px; }
        p { color:#6E6E73; font-size:14px; line-height:1.6; margin-bottom:24px; }
        a.btn {
            display:inline-block; background:#0066CC; color:#fff; text-decoration:none;
            padding:12px 28px; border-radius:8px; font-weight:600; font-size:14px;
            transition: background 0.2s;
        }
        a.btn:hover { background:#0A2540; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Acces interzis</h1>
        <p th:text="${message} ?: 'Nu ai permisiunea necesară pentru a accesa această pagină.'">
            Nu ai permisiunea necesară pentru a accesa această pagină.
        </p>
        <a class="btn" th:href="@{/dashboard}">Înapoi la Dashboard</a>
    </div>
</body>
</html>
