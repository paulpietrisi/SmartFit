<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Rapoarte Academie | Angajat SmartFit</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>📈 Rapoarte Academie</h1>
                <p class="subtitle">Statistici cursuri în perioada selectată</p>
            </div>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <form class="filter-bar" method="get" th:action="@{/angajat/rapoarte}">
            <div class="field">
                <label>De la data</label>
                <input type="date" name="from" th:value="${from}">
            </div>
            <div class="field">
                <label>Până la data</label>
                <input type="date" name="to" th:value="${to}">
            </div>
            <button type="submit" class="btn btn-primary">Generează</button>
        </form>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Cursuri finalizate</div>
                <div class="value" th:text="${academyReport.totalCompletions}">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Scor mediu</div>
                <div class="value green" th:text="${#numbers.formatDecimal(academyReport.averageScore,1,1)} + '%'">0%</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-box">
                <h3>Finalizări pe curs</h3>
                <canvas id="completionsChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Înscrieri pe curs</h3>
                <canvas id="enrollmentsChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Statistici detaliate pe curs</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Curs</th><th>Finalizări</th><th>Scor mediu</th></tr></thead>
                    <tbody>
                        <tr th:each="row : ${academyReport.statsByCourse}">
                            <td th:text="${row[0]}"></td>
                            <td th:text="${row[1]}"></td>
                            <td th:text="${row[2] != null ? #numbers.formatDecimal(row[2],1,1) + '%' : '-'}"></td>
                        </tr>
                        <tr th:if="${academyReport.statsByCourse.isEmpty()}">
                            <td colspan="3" class="empty-state">Nu există date în această perioadă.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script th:inline="javascript">
            const statsByCourse = /*[[${academyReport.statsByCourse}]]*/ [];
            const enrollmentCounts = /*[[${academyReport.enrollmentCounts}]]*/ [];

            new Chart(document.getElementById('completionsChart'), {
                type: 'bar',
                data: {
                    labels: statsByCourse.map(r => r[0]),
                    datasets: [{ label: 'Finalizări', data: statsByCourse.map(r => r[1]), backgroundColor: '#0066CC' }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            new Chart(document.getElementById('enrollmentsChart'), {
                type: 'bar',
                data: {
                    labels: enrollmentCounts.map(r => r[0]),
                    datasets: [{ label: 'Înscrieri', data: enrollmentCounts.map(r => r[1]), backgroundColor: '#30D158' }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        </script>
    </main>
</div>
</body>
</html>
