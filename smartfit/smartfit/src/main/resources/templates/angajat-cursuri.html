<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Cursuri | Angajat SmartFit</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>🎓 Cursuri (Academie)</h1>
                <p class="subtitle" th:text="${#lists.size(courses)} + ' cursuri găsite'">0</p>
            </div>
            <a class="btn btn-primary" th:if="${profile.canCreate}" th:href="@{/angajat/cursuri/nou}">➕ Curs nou</a>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <!-- FILTRE -->
        <form class="filter-bar" method="get" th:action="@{/angajat/cursuri}">
            <div class="field">
                <label>Căutare</label>
                <input type="text" name="q" th:value="${q}" placeholder="Titlu sau descriere...">
            </div>
            <div class="field">
                <label>Dificultate</label>
                <select name="difficulty">
                    <option value="">Toate</option>
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}" th:selected="${d == difficulty}"></option>
                </select>
            </div>
            <div class="field">
                <label>Puncte min.</label>
                <input type="number" name="minPoints" th:value="${minPoints}">
            </div>
            <div class="field">
                <label>Puncte max.</label>
                <input type="number" name="maxPoints" th:value="${maxPoints}">
            </div>
            <button type="submit" class="btn btn-primary">Filtrează</button>
            <a class="btn btn-secondary" th:href="@{/angajat/cursuri}">Resetează</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th></th><th>Titlu</th><th>Dificultate</th>
                        <th>Puncte</th><th>Prag promovare</th><th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${courses}">
                        <td th:text="${c.id}"></td>
                        <td style="font-size:22px" th:text="${c.emoji}"></td>
                        <td th:text="${c.title}"></td>
                        <td th:text="${c.difficulty}"></td>
                        <td th:text="${c.rewardPoints} + ' pct'"></td>
                        <td th:text="${c.passScorePercentage} + '%'"></td>
                        <td class="actions-cell">
                            <a class="btn btn-sm btn-secondary" th:if="${profile.canEdit}"
                               th:href="@{/angajat/cursuri/{id}/edit(id=${c.id})}">✏️ Editează</a>
                            <form th:if="${profile.canDelete}" th:action="@{/angajat/cursuri/{id}/sterge(id=${c.id})}" method="post"
                                  onsubmit="return confirm('Sigur dorești să ștergi acest curs? Toate întrebările asociate vor fi șterse.')">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️ Șterge</button>
                            </form>
                            <span th:if="${!profile.canEdit and !profile.canDelete}" style="color:var(--gray-text); font-size:12px;">doar vizualizare</span>
                        </td>
                    </tr>
                    <tr th:if="${courses.isEmpty()}">
                        <td colspan="7" class="empty-state">Nu există cursuri care să corespundă filtrelor.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
