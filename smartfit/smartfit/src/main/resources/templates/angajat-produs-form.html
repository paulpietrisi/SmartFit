<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${isNew} ? 'Produs nou | Angajat SmartFit' : 'Editare produs | Angajat SmartFit'">Produs</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1 th:text="${isNew} ? '➕ Produs nou' : '✏️ Editare produs'">Produs</h1>
                <p class="subtitle">Completează toate câmpurile obligatorii (*)</p>
            </div>
            <a class="btn btn-secondary" th:href="@{/angajat/produse}">← Înapoi la listă</a>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <div class="card">
            <form th:action="@{/angajat/produse/salveaza}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Nume produs *</label>
                        <input type="text" th:field="*{name}" placeholder="ex. Whey Protein Gold 2kg">
                        <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="form-group">
                        <label>Categorie *</label>
                        <input type="text" th:field="*{categoryName}" placeholder="ex. Suplimente" list="catlist">
                        <datalist id="catlist">
                            <option th:each="c : ${categories}" th:value="${c}"></option>
                        </datalist>
                        <div class="form-error" th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}"></div>
                    </div>

                    <div class="form-group">
                        <label>Preț (lei) *</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{price}">
                        <div class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="form-group">
                        <label>Stoc (buc.) *</label>
                        <input type="number" min="0" th:field="*{stockQuantity}">
                        <div class="form-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>URL imagine</label>
                        <input type="text" th:field="*{imageUrl}" placeholder="https://... sau /products/nume.jpg">
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Descriere</label>
                        <textarea th:field="*{description}" rows="4"></textarea>
                        <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Salvează</button>
                    <a class="btn btn-secondary" th:href="@{/angajat/produse}">Anulează</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
