<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Angajați | Admin SmartFit</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>🧑‍💼 Angajați</h1>
                <p class="subtitle" th:text="${#lists.size(employees)} + ' angajați'">0</p>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/angajati/nou}">➕ Angajat nou</a>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <!-- FILTRU DEPARTAMENT -->
        <form class="filter-bar" method="get" th:action="@{/admin/angajati}">
            <div class="field">
                <label>Departament</label>
                <select name="department">
                    <option value="">Toate</option>
                    <option value="ACADEMY" th:selected="${department == 'ACADEMY'}">Academie</option>
                    <option value="SHOP" th:selected="${department == 'SHOP'}">Magazin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Filtrează</button>
            <a class="btn btn-secondary" th:href="@{/admin/angajati}">Resetează</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nume</th><th>Email</th><th>Departament</th>
                        <th>Adaugă</th><th>Editează</th><th>Șterge</th><th>Angajat la</th><th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ep : ${employees}">
                        <td th:text="${ep.user.firstName} + ' ' + ${ep.user.lastName}"></td>
                        <td th:text="${ep.user.email}"></td>
                        <td><span class="badge" th:class="'badge badge-' + ${ep.department}"
                                  th:text="${ep.department == 'ACADEMY'} ? 'Academie' : 'Magazin'"></span></td>
                        <td th:text="${ep.canCreate} ? '✅' : '❌'"></td>
                        <td th:text="${ep.canEdit} ? '✅' : '❌'"></td>
                        <td th:text="${ep.canDelete} ? '✅' : '❌'"></td>
                        <td th:text="${ep.hiredDate != null ? #temporals.format(ep.hiredDate, 'dd.MM.yyyy') : '-'}"></td>
                        <td class="actions-cell">
                            <a class="btn btn-sm btn-secondary" th:href="@{/admin/angajati/{id}/edit(id=${ep.id})}">✏️ Editează</a>
                            <form th:action="@{/admin/angajati/{id}/sterge(id=${ep.id})}" method="post"
                                  onsubmit="return confirm('Sigur dorești să ștergi acest angajat? Contul de utilizator va fi șters definitiv.')">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️ Șterge</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${employees.isEmpty()}">
                        <td colspan="8" class="empty-state">Nu există angajați în acest departament.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
