<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Utilizatori | Admin SmartFit</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>👥 Utilizatori</h1>
                <p class="subtitle" th:text="${#lists.size(users)} + ' utilizatori găsiți'">0</p>
            </div>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <!-- FILTRE -->
        <form class="filter-bar" method="get" th:action="@{/admin/utilizatori}">
            <div class="field">
                <label>Căutare</label>
                <input type="text" name="q" th:value="${q}" placeholder="Nume sau email...">
            </div>
            <div class="field">
                <label>Rol</label>
                <select name="role">
                    <option value="">Toate</option>
                    <option value="USER" th:selected="${role == 'USER'}">USER</option>
                    <option value="EMPLOYEE" th:selected="${role == 'EMPLOYEE'}">EMPLOYEE</option>
                    <option value="ADMIN" th:selected="${role == 'ADMIN'}">ADMIN</option>
                </select>
            </div>
            <div class="field">
                <label>Obiectiv</label>
                <select name="goal">
                    <option value="">Toate</option>
                    <option value="LOSE_WEIGHT" th:selected="${goal == 'LOSE_WEIGHT'}">Slăbire</option>
                    <option value="MAINTAIN" th:selected="${goal == 'MAINTAIN'}">Menținere</option>
                    <option value="GAIN_MUSCLE" th:selected="${goal == 'GAIN_MUSCLE'}">Masă musculară</option>
                </select>
            </div>
            <div class="field">
                <label>Gen</label>
                <select name="gender">
                    <option value="">Toate</option>
                    <option value="M" th:selected="${gender == 'M'}">M</option>
                    <option value="F" th:selected="${gender == 'F'}">F</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Filtrează</button>
            <a class="btn btn-secondary" th:href="@{/admin/utilizatori}">Resetează</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Nume</th><th>Email</th><th>Rol</th>
                        <th>Obiectiv</th><th>Fit Points</th><th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.firstName} + ' ' + ${u.lastName}"></td>
                        <td th:text="${u.email}"></td>
                        <td><span class="badge" th:class="'badge badge-' + ${u.role}" th:text="${u.role}"></span></td>
                        <td th:text="${u.goal}"></td>
                        <td th:text="${u.fitPoints}"></td>
                        <td class="actions-cell">
                            <form th:if="${u.role != 'ADMIN'}" th:action="@{/admin/utilizatori/{id}/sterge(id=${u.id})}" method="post"
                                  onsubmit="return confirm('Sigur dorești să ștergi acest cont? Acțiunea este ireversibilă.')">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️ Șterge</button>
                            </form>
                            <span th:if="${u.role == 'ADMIN'}" style="color:var(--gray-text); font-size:12px;">protejat</span>
                        </td>
                    </tr>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="7" class="empty-state">Nu există utilizatori care să corespundă filtrelor.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
