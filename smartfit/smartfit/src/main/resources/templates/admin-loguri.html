<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Log-uri aplicație | Admin SmartFit</title>
    <th:block th:replace="fragments/admin-layout :: styles"></th:block>
</head>
<body>
<div class="layout">
    <div th:replace="fragments/admin-layout :: sidebar"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>🧾 Log-uri de utilizare aplicație</h1>
                <p class="subtitle">Audit complet: cine, ce acțiune, când, și comanda SQL echivalentă</p>
            </div>
            <a class="btn btn-secondary"
               th:href="@{/admin/loguri/export/excel(email=${email},role=${role},department=${department},actionType=${actionType},entityType=${entityType},from=${from},to=${to})}">
               ⬇️ Export Excel
            </a>
        </div>

        <div th:replace="fragments/admin-layout :: alerts"></div>

        <!-- FILTRE -->
        <form class="filter-bar" method="get" th:action="@{/admin/loguri}">
            <div class="field">
                <label>Email utilizator</label>
                <input type="text" name="email" th:value="${email}" placeholder="email@exemplu.ro">
            </div>
            <div class="field">
                <label>Rol</label>
                <select name="role">
                    <option value="">Toate</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == role}"></option>
                </select>
            </div>
            <div class="field">
                <label>Departament</label>
                <select name="department">
                    <option value="">Toate</option>
                    <option value="ACADEMY" th:selected="${department == 'ACADEMY'}">Academie</option>
                    <option value="SHOP" th:selected="${department == 'SHOP'}">Magazin</option>
                </select>
            </div>
            <div class="field">
                <label>Tip acțiune</label>
                <select name="actionType">
                    <option value="">Toate</option>
                    <option th:each="a : ${actionTypes}" th:value="${a}" th:text="${a}" th:selected="${a == actionType}"></option>
                </select>
            </div>
            <div class="field">
                <label>Entitate</label>
                <select name="entityType">
                    <option value="">Toate</option>
                    <option th:each="e : ${entityTypes}" th:value="${e}" th:text="${e}" th:selected="${e == entityType}"></option>
                </select>
            </div>
            <div class="field">
                <label>De la data</label>
                <input type="date" name="from" th:value="${from}">
            </div>
            <div class="field">
                <label>Până la data</label>
                <input type="date" name="to" th:value="${to}">
            </div>
            <button type="submit" class="btn btn-primary">Filtrează</button>
            <a class="btn btn-secondary" th:href="@{/admin/loguri}">Resetează</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Data/Ora</th><th>Utilizator</th><th>Rol</th><th>Dept.</th>
                        <th>Acțiune</th><th>Descriere</th><th>Entitate</th><th>Comandă SQL</th><th>IP</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td th:text="${#temporals.format(log.loggedAt, 'dd.MM.yyyy HH:mm:ss')}"></td>
                        <td th:text="${log.userEmail}"></td>
                        <td><span class="badge" th:class="'badge badge-' + ${log.userRole}" th:text="${log.userRole}"></span></td>
                        <td>
                            <span th:if="${log.department != null}" class="badge"
                                  th:class="'badge badge-' + ${log.department}"
                                  th:text="${log.department == 'ACADEMY'} ? 'Academie' : 'Magazin'"></span>
                            <span th:if="${log.department == null}">-</span>
                        </td>
                        <td th:text="${log.actionType}"></td>
                        <td th:text="${log.actionDescription}"></td>
                        <td th:text="${log.entityType != null ? (log.entityType + ' #' + (log.entityId ?: '?')) : '-'}"></td>
                        <td>
                            <code th:if="${log.sqlCommand != null}" style="font-size:11px; color:var(--gray-text);"
                                  th:text="${#strings.abbreviate(log.sqlCommand, 60)}"></code>
                            <span th:if="${log.sqlCommand == null}">-</span>
                        </td>
                        <td th:text="${log.ipAddress}"></td>
                    </tr>
                    <tr th:if="${logs.isEmpty()}">
                        <td colspan="9" class="empty-state">Nu există log-uri care să corespundă filtrelor.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- PAGINARE -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:class="${i == currentPage} ? 'active' : ''"
               th:href="@{/admin/loguri(email=${email},role=${role},department=${department},actionType=${actionType},entityType=${entityType},from=${from},to=${to},page=${i})}"
               th:text="${i + 1}"></a>
        </div>
    </main>
</div>
</body>
</html>
